server {
    listen 80;
    server_name localhost;

    # Nơi lưu trữ mã nguồn giao diện tĩnh
    root /usr/share/nginx/html;
    index index.html;

    # 1. Gzip nén dữ liệu giúp tải trang siêu tốc
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 2. Security Headers (Bảo mật tầng Reverse Proxy)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Giới hạn kích thước file upload (tối đa 25MB cho tài liệu/đính kèm)
    client_max_body_size 25M;

    # 3. Định tuyến Frontend SPA & No-Cache cho Static files để luôn cập nhật tức thì
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    # 4. Reverse Proxy chuyển tiếp API sang Backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Chuyển tiếp Swagger UI & OpenAPI Docs
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Trang lỗi tùy chỉnh
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
