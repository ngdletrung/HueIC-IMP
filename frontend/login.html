<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - HueIC IMP Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hueic: {
                            blue: '#0d47a1',
                            dark: '#0a3578',
                            orange: '#e65100',
                            light: '#e3f2fd'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header Brand -->
        <div class="bg-gradient-to-r from-blue-800 to-blue-950 p-8 text-center text-white relative">
            <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-graduation-cap text-blue-800 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">HueIC IMP</h1>
            <p class="text-xs text-blue-200 mt-1 uppercase tracking-wider font-semibold">Cổng Quản Lý & Điều Hành Nội Bộ</p>
            <p class="text-xs text-blue-300 mt-0.5">Trường Cao đẳng Công nghiệp Huế</p>
        </div>

        <!-- Form Login -->
        <div class="p-8">
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Tên đăng nhập / Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
                            placeholder="Nhập username (ví dụ: admin)">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Mật khẩu</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-600">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded text-blue-600 focus:ring-blue-500">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="javascript:void(0)" onclick="alert('Vui lòng liên hệ Phòng Tổ chức - Cán bộ hoặc Ban Quản trị để đặt lại mật khẩu.')" class="text-blue-700 font-semibold hover:underline">Quên mật khẩu?</a>
                </div>

                <button type="submit" id="btnSubmit"
                    class="w-full py-3 bg-blue-800 hover:bg-blue-900 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                    <span>Đăng Nhập Cổng IMP</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

            <!-- Quick Demo Accounts -->
            <div class="mt-6 pt-5 border-t border-slate-200">
                <p class="text-xs font-bold text-slate-500 mb-2 uppercase text-center">Tài khoản trải nghiệm mẫu:</p>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button onclick="fillAccount('admin', 'HueIC@2026!')" class="p-2 bg-blue-50 hover:bg-blue-100 text-blue-900 rounded-lg border border-blue-200 text-left transition">
                        <div class="font-bold">👑 SuperAdmin</div>
                        <div class="text-[11px] text-blue-600">admin / HueIC@2026!</div>
                    </button>
                    <button onclick="fillAccount('qtdt', 'HueIC@123')" class="p-2 bg-slate-50 hover:bg-slate-100 text-slate-800 rounded-lg border border-slate-200 text-left transition">
                        <div class="font-bold">🎓 Trưởng Phòng QTĐT</div>
                        <div class="text-[11px] text-slate-500">qtdt / HueIC@123</div>
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-slate-50 p-4 text-center text-xs text-slate-500 border-t border-slate-200">
            &copy; 2026 Trường Cao đẳng Công nghiệp Huế. All rights reserved.
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        function fillAccount(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        // Tự động chuyển hướng nếu đã đăng nhập
        if (localStorage.getItem('hueic_token')) {
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const alertBox = document.getElementById('alertBox');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Đang xác thực...</span>`;
            alertBox.className = 'hidden';

            try {
                const res = await fetch('/api/v1/auth/login/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Đăng nhập thất bại.');
                }

                // Lưu thông tin phiên đăng nhập
                localStorage.setItem('hueic_token', data.access_token);
                localStorage.setItem('hueic_user', JSON.stringify({
                    id: data.user_id,
                    username: data.username,
                    full_name: data.full_name,
                    role: data.role,
                    department_name: data.department_name
                }));

                alertBox.className = 'mb-4 p-3 rounded-lg text-sm bg-green-50 text-green-700 border border-green-200 block';
                alertBox.innerText = 'Đăng nhập thành công! Đang chuyển hướng...';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);

            } catch (err) {
                alertBox.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200 block';
                alertBox.innerText = err.message || 'Lỗi kết nối máy chủ.';
                btn.disabled = false;
                btn.innerHTML = `<span>Đăng Nhập Cổng IMP</span> <i class="fa-solid fa-arrow-right text-sm"></i>`;
            }
        });
    </script>
</body>
</html>
